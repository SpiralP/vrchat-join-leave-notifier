[package]
name = "vrchat-join-leave-notifier"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "=1.0.104"
deunicode = "=1.6.2"
dirs = "=7.0.0"
openvr = { git = "https://github.com/SpiralP/rust-openvr.git" }
rodio = { version = "=0.22.2", default-features = false, features = ["playback", "wav"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
time = { version = "=0.3.55", features = ["formatting", "local-offset"] }
tokio = { version = "=1.53.3", features = ["full"] }
